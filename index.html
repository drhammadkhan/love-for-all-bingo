<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bingo Card Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0f1217;
      --panel: #151a22;
      --accent: #f0b429;
      --accent-2: #42d392;
      --text: #f5f7fb;
      --muted: #9aa4b2;
      --grid-gap: 8px;
      --cell: #1c2330;
      --cell-marked: #2a3a2f;
      --cell-border: #293244;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(66, 211, 146, 0.15), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(240, 180, 41, 0.18), transparent 60%),
        linear-gradient(180deg, #0d1015 0%, #0f1217 35%, #10151c 100%);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
      display: grid;
      grid-template-columns: minmax(260px, 340px) 1fr;
      gap: 28px;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 40px);
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 680px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #1f2632;
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 18px;
    }

    label {
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 260px;
      margin-top: 10px;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2a3342;
      background: #0f141c;
      color: var(--text);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.35;
      resize: vertical;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .toggle input { transform: scale(1.1); }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #1a1405;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button.secondary {
      background: #1f2632;
      color: var(--text);
      border: 1px solid #2a3342;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.3); }

    .card-panel {
      display: grid;
      gap: 16px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(70px, 1fr));
      gap: var(--grid-gap);
    }

    .cell {
      background: var(--cell);
      border: 1px solid var(--cell-border);
      border-radius: 12px;
      min-height: 86px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(12px, 1.3vw, 16px);
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cell.marked {
      background: var(--cell-marked);
      border-color: #3d5744;
      box-shadow: inset 0 0 0 2px rgba(66, 211, 146, 0.45);
    }

    .cell.marked::after {
      content: "\2713";
      position: absolute;
      margin-left: auto;
      margin-right: auto;
      top: 8px;
      right: 10px;
      font-size: 14px;
      color: var(--accent-2);
    }

    .cell span {
      pointer-events: none;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    .celebration {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(66, 211, 146, 0.5);
      background: linear-gradient(120deg, rgba(66, 211, 146, 0.18), rgba(240, 180, 41, 0.12));
      color: var(--text);
      font-weight: 600;
      animation: pop 0.35s ease;
    }

    .celebration.show {
      display: flex;
    }

    .celebration button {
      padding: 8px 12px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .confetti span {
      position: absolute;
      width: 10px;
      height: 14px;
      opacity: 0.9;
      animation: fall 1.6s ease-in forwards;
      border-radius: 3px;
    }

    .celebrate-bg {
      animation: glow 1.2s ease-in-out;
    }

    @keyframes pop {
      from { transform: scale(0.98); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(280deg); opacity: 0; }
    }

    @keyframes glow {
      0% { box-shadow: 0 0 0 rgba(66, 211, 146, 0); }
      50% { box-shadow: 0 0 80px rgba(66, 211, 146, 0.12); }
      100% { box-shadow: 0 0 0 rgba(66, 211, 146, 0); }
    }

    @media (max-width: 920px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bingo Card Generator</h1>
      <p class="subtitle">Generate a unique 5x5 bingo card from your custom word list. Click any square to mark it, and your progress stays saved in your browser.</p>
    </header>

    <section class="panel controls">
      <div>
        <label for="wordList">Word List (one per line)</label>
        <textarea id="wordList"></textarea>
      </div>
      <div class="row">
        <label class="toggle"><input id="freeCenter" type="checkbox" checked> Free center square</label>
        <button id="generateBtn">Generate New Card</button>
      </div>
      <div class="row">
        <button id="clearMarks" class="secondary">Clear Marks</button>
        <span class="note" id="status"></span>
      </div>
    </section>

    <section class="panel card-panel">
      <div class="card-meta">
        <span>Card ID: <span id="cardId">-</span></span>
        <span id="wordCount"></span>
        <span id="winCount"></span>
      </div>
      <div id="celebration" class="celebration">
        <span id="celebrationText">Bingo!</span>
        <button id="dismissCelebrate" type="button">Nice</button>
      </div>
      <div id="grid" class="grid"></div>
      <p class="note">Tip: bookmark this page. Your last card loads automatically.</p>
    </section>
  </div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script>
    const defaultWords = [
      "Design review", "Retro", "Scope creep", "Unexpected bug", "Pairing session", "Breakthrough", "Refactor", "Stakeholder", "Coffee run",
      "Deployment", "Hotfix", "Performance win", "Ship it", "Timeout", "Integration", "Edge case", "Docs update", "New feature",
      "Feedback loop", "Sprint planning", "QA pass", "Outage", "Green build", "UX tweak", "Stretch goal", "Release candidate",
      "Build fails", "Async update", "Quick win", "Analytics", "Launch day"
    ];

    const wordListEl = document.getElementById("wordList");
    const freeCenterEl = document.getElementById("freeCenter");
    const generateBtn = document.getElementById("generateBtn");
    const clearMarksBtn = document.getElementById("clearMarks");
    const gridEl = document.getElementById("grid");
    const cardIdEl = document.getElementById("cardId");
    const statusEl = document.getElementById("status");
    const wordCountEl = document.getElementById("wordCount");
    const winCountEl = document.getElementById("winCount");
    const celebrationEl = document.getElementById("celebration");
    const celebrationTextEl = document.getElementById("celebrationText");
    const dismissCelebrateEl = document.getElementById("dismissCelebrate");
    const confettiEl = document.getElementById("confetti");

    const LAST_CARD_KEY = "bingo-last-card-id";

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createId() {
      return "card-" + Math.random().toString(36).slice(2, 10);
    }

    function parseWords() {
      return wordListEl.value
        .split(/\r?\n/)
        .map(w => w.trim())
        .filter(Boolean);
    }

    function validateWords(words, freeCenter) {
      const needed = freeCenter ? 24 : 25;
      if (words.length < needed) {
        statusEl.textContent = `Need at least ${needed} words. You have ${words.length}.`;
        return false;
      }
      statusEl.textContent = "";
      return true;
    }

    function saveCard(card) {
      localStorage.setItem(card.id, JSON.stringify(card));
      localStorage.setItem(LAST_CARD_KEY, card.id);
    }

    function loadCard(id) {
      const raw = localStorage.getItem(id);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function renderCard(card) {
      gridEl.innerHTML = "";
      cardIdEl.textContent = card.id;
      wordCountEl.textContent = `${card.words.length} words`;
      celebrationEl.classList.toggle("show", Boolean(card.completedLines && card.completedLines.length));
      updateWinCounter(card);

      card.words.forEach((word, idx) => {
        const cell = document.createElement("div");
        cell.className = "cell" + (card.marks[idx] ? " marked" : "");
        cell.setAttribute("role", "button");
        cell.setAttribute("aria-pressed", card.marks[idx] ? "true" : "false");
        cell.addEventListener("click", () => toggleMark(card, idx));
        const span = document.createElement("span");
        span.textContent = word;
        cell.appendChild(span);
        gridEl.appendChild(cell);
      });
    }

    function toggleMark(card, idx) {
      card.marks[idx] = !card.marks[idx];
      const wins = getWinningLines(card);
      const prev = card.completedLines || [];
      const newWins = wins.filter(name => !prev.includes(name));
      if (newWins.length) {
        card.winCount = (card.winCount || 0) + newWins.length;
        celebrate(newWins);
      }
      card.completedLines = wins;
      saveCard(card);
      renderCard(card);
    }

    function getWinningLines(card) {
      const lines = [];
      for (let r = 0; r < 5; r++) {
        lines.push({
          name: `Row ${r + 1}`,
          idxs: [r * 5, r * 5 + 1, r * 5 + 2, r * 5 + 3, r * 5 + 4],
        });
      }
      for (let c = 0; c < 5; c++) {
        lines.push({
          name: `Column ${c + 1}`,
          idxs: [c, c + 5, c + 10, c + 15, c + 20],
        });
      }
      lines.push({ name: "Diagonal TL-BR", idxs: [0, 6, 12, 18, 24] });
      lines.push({ name: "Diagonal TR-BL", idxs: [4, 8, 12, 16, 20] });

      const winners = lines.filter(line => line.idxs.every(i => card.marks[i]));
      return winners.map(w => w.name);
    }

    function celebrate(lineNames) {
      if (lineNames.length === 1) {
        celebrationTextEl.textContent = `Bingo! ${lineNames[0]} complete.`;
      } else {
        celebrationTextEl.textContent = `Bingo! ${lineNames.length} lines completed.`;
      }
      celebrationEl.classList.add("show");
      document.body.classList.add("celebrate-bg");
      spawnConfetti();
      setTimeout(() => document.body.classList.remove("celebrate-bg"), 1200);
    }

    function spawnConfetti() {
      confettiEl.innerHTML = "";
      const colors = ["#f0b429", "#42d392", "#f05252", "#60a5fa", "#a78bfa"];
      const count = 70;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * 0.3}s`;
        piece.style.transform = `translateY(-20px) rotate(${Math.random() * 180}deg)`;
        confettiEl.appendChild(piece);
      }
      setTimeout(() => { confettiEl.innerHTML = ""; }, 1800);
    }

    function buildCard(words, freeCenter, id = createId()) {
      const needed = freeCenter ? 24 : 25;
      const chosen = shuffle(words).slice(0, needed);
      const cardWords = [];
      let chosenIndex = 0;
      for (let i = 0; i < 25; i++) {
        if (freeCenter && i === 12) {
          cardWords.push("FREE");
        } else {
          cardWords.push(chosen[chosenIndex++]);
        }
      }
      const marks = cardWords.map((word, idx) => freeCenter && idx === 12 ? true : false);
      return { id, words: cardWords, freeCenter, marks, completedLines: [], winCount: 0 };
    }

    function generateNewCard() {
      const words = parseWords();
      const freeCenter = freeCenterEl.checked;
      if (!validateWords(words, freeCenter)) return;
      const card = buildCard(words, freeCenter);
      saveCard(card);
      renderCard(card);
    }

    function clearMarks() {
      const id = localStorage.getItem(LAST_CARD_KEY);
      if (!id) return;
      const card = loadCard(id);
      if (!card) return;
      card.marks = card.marks.map((_, idx) => card.freeCenter && idx === 12 ? true : false);
      card.completedLines = [];
      card.winCount = 0;
      saveCard(card);
      renderCard(card);
    }

    function updateWinCounter(card) {
      const count = card.completedLines ? card.completedLines.length : 0;
      if (count === 0) {
        wordCountEl.textContent = `${card.words.length} words`;
      } else {
        const label = count === 1 ? "line" : "lines";
        wordCountEl.textContent = `${card.words.length} words • ${count} ${label} complete`;
      }
      const wins = card.winCount || 0;
      winCountEl.textContent = wins ? `Wins: ${wins}` : "";
    }

    function init() {
      wordListEl.value = defaultWords.join("\n");
      const lastId = localStorage.getItem(LAST_CARD_KEY);
      if (lastId) {
        const card = loadCard(lastId);
        if (card) {
          freeCenterEl.checked = card.freeCenter;
          renderCard(card);
          return;
        }
      }
      generateNewCard();
    }

    generateBtn.addEventListener("click", generateNewCard);
    clearMarksBtn.addEventListener("click", clearMarks);
    dismissCelebrateEl.addEventListener("click", () => celebrationEl.classList.remove("show"));
    freeCenterEl.addEventListener("change", () => {
      const words = parseWords();
      validateWords(words, freeCenterEl.checked);
    });

    init();
  </script>
</body>
</html>
